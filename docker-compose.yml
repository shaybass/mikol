version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mikol_db
    environment:
      POSTGRES_USER: mikol
      POSTGRES_PASSWORD: mikol_password
      POSTGRES_DB: mikol_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mikol -d mikol_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
